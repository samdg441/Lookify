name: virtual_closet
description: Your closet, curated. AI-powered virtual wardrobe for mobile.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  firebase_crashlytics: ^4.3.10
  cloud_functions: ^5.5.0

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Media
  image_picker: ^1.1.2

  # On-device background removal (Android only, see BackgroundRemovalService)
  google_mlkit_subject_segmentation: ^0.1.0
  path_provider: ^2.1.5

  # Calendar
  table_calendar: ^3.1.2

  # Charts
  fl_chart: ^0.68.0

  # Utils
  intl: ^0.20.2
  shared_preferences: ^2.3.3
  uuid: ^4.4.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
